{% extends "layout.html" %}

{% block title %}
    Post
{% endblock %}

{% block content %}
    <section>
        {% for post in posts %}
            <h1>Posts</h1>
            <article class="post">
                <h2>{{ post.title }}</h2>
                <p>{{ post.body }}</p>
                <p>Posted on {{ post.date }}</p>
            </article>
        {% empty %}
            <p>No posts available.</p>
        {% endfor %}
    </section>
    
{% endblock %}
